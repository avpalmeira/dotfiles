# vim:fileencoding=utf-8:foldmethod=marker

auto_reload_config 0.1

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Fonts
font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

# Window
window_padding_width 10

# Scrollback
scrollback_lines 5000

# Cursor
cursor #e78284
cursor_shape underline
cursor_trail 10
cursor_trail_decay 0.1 0.2
cursor_trail_threshold 0

# Notify when a long command finishes in a window that isn't focused.
# Replaces oh-my-zsh's bgnotify plugin; uses kitty's shell integration.
notify_on_cmd_finish unfocused 10.0
